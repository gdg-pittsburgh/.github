name: Backfill Events to NocoDB

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch GitHub Project items
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ organization(login: \"gdg-pittsburgh\") { projectV2(number: 2) { items(first: 100) { nodes { id content { ... on Issue { title body url createdAt state labels(first: 5) { nodes { name } } } } fieldValues(first: 10) { nodes { ... on ProjectV2ItemFieldTextValue { text field { ... on ProjectV2FieldCommon { name } } } ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } } ... on ProjectV2ItemFieldDateValue { date field { ... on ProjectV2FieldCommon { name } } } } } } } } } }"}' \
            > project_items.json
          echo "GraphQL fetch complete"

      - name: Push to NocoDB
        env:
          NOCO_TOKEN: ${{ secrets.NOCO_API_TOKEN }}
          NOCO_URL: https://plash-dev-nocodb.ilmfwu.easypanel.host
          NOCO_TABLE_ID: mkcrqxmha8litwl
        run: python3 scripts/sync_events.py
